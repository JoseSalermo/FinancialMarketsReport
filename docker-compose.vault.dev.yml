services:
  vault:
    image: hashicorp/vault:latest
    container_name: financial-market-report-vault-dev
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-only-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      SKIP_SETCAP: "true"
    cap_add:
      - IPC_LOCK
    command: server -dev
